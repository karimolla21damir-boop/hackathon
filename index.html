<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сағат Әшімбаев атындағы орта мектеп — School Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0B1F3A',
            secondary: '#142B4D',
            accent: '#38BDF8',
            accent2: '#7C3AED',
            gold: '#F59E0B',
            soft: '#F8FAFC',
            success: '#22C55E',
            warning: '#F59E0B',
            danger: '#EF4444',
            rose: '#E11D48'
          },
          boxShadow: {
            card: '0 12px 35px rgba(11, 31, 58, 0.12)',
            glam: '0 15px 50px rgba(56, 189, 248, 0.18)',
            deep: '0 20px 60px rgba(11, 31, 58, 0.22)'
          },
          backgroundImage: {
            'hero-glow': 'radial-gradient(circle at top right, rgba(56,189,248,0.30), transparent 30%), radial-gradient(circle at top left, rgba(124,58,237,0.22), transparent 28%), linear-gradient(135deg, #0B1F3A 0%, #142B4D 50%, #1D4ED8 100%)'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 20%, rgba(56,189,248,.08), transparent 20%),
        radial-gradient(circle at 90% 10%, rgba(124,58,237,.08), transparent 25%),
        linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
    }

    .glass {
      backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255,255,255,0.45);
    }

    .sidebar-link.active {
      background: linear-gradient(135deg, #38BDF8, #7C3AED);
      color: white;
      box-shadow: 0 10px 25px rgba(56,189,248,.28);
    }

    .fade-in {
      animation: fade .28s ease;
    }

    @keyframes fade {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }

    .ornament {
      position: relative;
      overflow: hidden;
    }

    .ornament::before {
      content: "";
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(56,189,248,.22), transparent 70%);
    }

    .ornament::after {
      content: "";
      position: absolute;
      bottom: -70px;
      left: -60px;
      width: 200px;
      height: 200px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(124,58,237,.18), transparent 70%);
    }

    .premium-border {
      border: 1px solid rgba(56, 189, 248, 0.18);
    }

    .metric-ring {
      background: conic-gradient(#38BDF8 0deg, #7C3AED 180deg, #F59E0B 300deg, #38BDF8 360deg);
      padding: 2px;
      border-radius: 24px;
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="app"></div>

  <!-- AI Assistant Button -->
  <button id="aiToggleBtn" onclick="toggleAIChat()" class="fixed bottom-6 right-6 z-50 rounded-full bg-gradient-to-r from-sky-500 to-violet-600 p-4 text-white shadow-2xl hover:scale-105 transition">
    🤖
  </button>

  <!-- AI Chat -->
  <div id="aiChatBox" class="fixed bottom-24 right-6 z-50 hidden w-[360px] max-w-[calc(100%-20px)] overflow-hidden rounded-[24px] border border-white/20 bg-white shadow-2xl">
    <div class="bg-gradient-to-r from-primary via-secondary to-accent2 px-5 py-4 text-white">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-bold">AI Помощник директора</h3>
          <p class="text-xs text-slate-200">Рекомендации по управленческим решениям</p>
        </div>
        <button onclick="toggleAIChat()" class="text-white text-xl font-bold">×</button>
      </div>
    </div>

    <div id="aiMessages" class="max-h-[380px] overflow-y-auto bg-slate-50 px-4 py-4 space-y-3">
      <div class="rounded-2xl bg-sky-100 px-4 py-3 text-sm text-slate-700">
        Здравствуйте! Я AI-помощник директора. Могу подсказать рекомендации по:
        <br>• посещаемости
        <br>• успеваемости
        <br>• слабым классам
        <br>• планированию
        <br>• мониторингу
        <br>• анализу
      </div>
    </div>

    <div class="border-t border-slate-200 bg-white p-3">
      <div class="flex gap-2">
        <input
          id="aiInput"
          type="text"
          placeholder="Например: как улучшить посещаемость?"
          class="flex-1 rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-sky-400"
          onkeydown="if(event.key==='Enter')sendAIMessage()"
        />
        <button onclick="sendAIMessage()" class="rounded-2xl bg-gradient-to-r from-sky-500 to-violet-600 px-4 py-3 text-sm font-bold text-white">
          Отправить
        </button>
      </div>
    </div>
  </div>

  <script>

    const classMonthlyData = {

        { month: 'Май', performance: 4.4, attendance: 93 }
      ],

        { month: 'Фев', performance: 4.6, attendance: 95 },
        { month: 'Мар', performance: 4.7, attendance: 96 },
        { month: 'Апр', performance: 4.8, attendance: 97 },
        { month: 'Май', performance: 4.9, attendance: 98 }
      ]
    };

    const schoolMonthlyPerformance = [
      { month: 'Янв', performance: 4.1, attendance: 91 },
      { month: 'Фев', performance: 4.2, attendance: 92 },
      { month: 'Мар', performance: 4.3, attendance: 93 },
      { month: 'Апр', performance: 4.4, attendance: 94 },
      { month: 'Май', performance: 4.5, attendance: 95 },
      { month: 'Июн', performance: 4.6, attendance: 96 }
    ];

    const classComparison = [
      { className: '8C', avgScore: 4.15, attendance: 90.5 },
      { className: '9B', avgScore: 4.2, attendance: 90.0 },
      { className: '10A', avgScore: 4.6, attendance: 94.7 },
      { className: '11A', avgScore: 4.8, attendance: 96.0 }
    ];

    const planningItems = [
      { id: 1, title: 'Повышение среднего балла школы', owner: 'Зам. директора по УР', deadline: '2025-05-20', progress: 72, status: 'В процессе' },
      { id: 2, title: 'Мониторинг посещаемости 9-11 классов', owner: 'Соц. педагог', deadline: '2025-05-15', progress: 88, status: 'Почти завершено' },
      { id: 3, title: 'Подготовка к итоговой аттестации', owner: 'Руководители МО', deadline: '2025-06-01', progress: 60, status: 'В процессе' },
      { id: 4, title: 'Анализ качества знаний за четверть', owner: 'Директор', deadline: '2025-05-10', progress: 95, status: 'Завершение' }
    ];

    const studentProgress = [
      { month: 'Янв', score: 4.2, attendance: 94 },
      { month: 'Фев', score: 4.4, attendance: 95 },
      { month: 'Мар', score: 4.5, attendance: 97 },
      { month: 'Апр', score: 4.6, attendance: 96 },
      { month: 'Май', score: 4.7, attendance: 98 }
    ];

    const studentTasks = [
      { id: 1, title: 'Подготовить проект по биологии', date: '12 мая', type: 'Дедлайн' },
      { id: 2, title: 'Школьная олимпиада по математике', date: '15 мая', type: 'Мероприятие' },
      { id: 3, title: 'Сдать эссе по истории', date: '18 мая', type: 'Дедлайн' },
      { id: 4, title: 'Родительское собрание', date: '22 мая', type: 'Мероприятие' }
    ];

    let currentPage = 'login';
    let performanceChartInstance = null;
    let attendanceChartInstance = null;
    let comparePerformanceChartInstance = null;
    let compareAttendanceChartInstance = null;
    let studentChartInstance = null;

    function getStoredUser() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }

    function setStoredUser(user) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
    }

    function logoutUser() {
      localStorage.removeItem(STORAGE_KEY);
      currentPage = 'login';
      renderApp();
    }

    function loginUser(email, password) {
      if (password !== DEMO_PASSWORD) return null;

      let user = null;

      if (email === 'admin@school.kz') {
        user = {
          email,
          role: 'admin',
          name: DIRECTOR_NAME,
          position: 'Директор школы'
        };
      }

      if (email === 'student@school.kz') {
        user = {
          email,
          role: 'user',
          name: 'Алихан Нұрланұлы',
          className: '10A'
        };
      }

      if (user) setStoredUser(user);
      return user;
    }

    function navigateTo(page) {
      const user = getStoredUser();

      if (!user) {
        currentPage = 'login';
        renderApp();
        return;
      }

      if (user.role === 'user' && page.startsWith('admin')) {
        currentPage = 'student-dashboard';
        renderApp();
        return;
      }

      if (user.role === 'admin' && page.startsWith('student')) {
        currentPage = 'admin-dashboard';
        renderApp();
        return;
      }

      currentPage = page;
      renderApp();
    }

    function statCard(title, value, subtitle, gradient, badge) {
      return `
        <div class="metric-ring shadow-glam">
          <div class="ornament relative rounded-[22px] bg-white p-5 h-full">
            <div class="flex items-start justify-between gap-4">
              <div class="relative z-10">
                <div class="mb-2 inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">${badge || 'Показатель'}</div>
                <p class="text-sm text-slate-500">${title}</p>
                <h3 class="mt-2 text-3xl font-black tracking-tight text-primary">${value}</h3>
                <p class="mt-2 text-sm text-slate-500">${subtitle || ''}</p>
              </div>
              <div class="relative z-10 h-14 w-14 rounded-2xl ${gradient} shadow-lg"></div>
            </div>
          </div>
        </div>
      `;
    }

    function getLayout(content) {
      const user = getStoredUser();
      const adminLinks = [
        ['admin-dashboard', 'Дашборд'],
        ['admin-students', 'Список учеников'],
        ['admin-planning', 'Планирование'],
        ['admin-monitoring', 'Мониторинг'],
        ['admin-analysis', 'Анализ']
      ];
      const userLinks = [
        ['student-dashboard', 'Мой кабинет']
      ];
      const links = user.role === 'admin' ? adminLinks : userLinks;

      return `
        <div class="min-h-screen md:flex">
          <aside class="w-full bg-hero-glow text-white shadow-deep md:min-h-screen md:w-80">
            <div class="border-b border-white/10 px-6 py-7">
              <div class="mb-4 inline-flex rounded-2xl bg-white/10 px-4 py-2 text-xs font-bold uppercase tracking-[0.2em] text-sky-200">
                Edu-Tech Management
              </div>
              <h2 class="text-2xl font-black leading-tight">${SCHOOL_NAME}</h2>
              <p class="mt-3 text-sm text-slate-200">${user.role === 'admin' ? 'Панель директора' : 'Личный кабинет ученика'}</p>
            </div>

            <div class="px-6 py-5">
              <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                <p class="text-xs uppercase tracking-[0.2em] text-sky-200">Пользователь</p>
                <h3 class="mt-2 text-lg font-bold">${user.name}</h3>
                <p class="mt-1 text-sm text-slate-200">${user.role === 'admin' ? 'Директор школы' : 'Ученик ' + user.className}</p>
              </div>
            </div>

            <nav class="flex flex-col gap-2 px-4 pb-6">
              ${links.map(([key, label]) => `
                <button onclick="navigateTo('${key}')" class="sidebar-link text-left rounded-2xl px-5 py-4 text-sm font-semibold transition ${currentPage === key ? 'active' : 'text-slate-100 hover:bg-white/10'}">
                  ${label}
                </button>
              `).join('')}
            </nav>
          </aside>

          <div class="flex-1">
            <header class="glass sticky top-0 z-30 border-b border-white/50 px-4 py-4 shadow-sm md:px-8">
              <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                  <div class="inline-flex rounded-full bg-sky-100 px-3 py-1 text-xs font-bold text-sky-700">Управленческие компетенции директора</div>
                  <h1 class="mt-2 text-2xl font-black text-primary">Планирование • Мониторинг • Анализ</h1>
                  <p class="mt-1 text-sm text-slate-500">${SCHOOL_NAME}</p>
                </div>
                <div class="flex items-center gap-4">
                  <div class="hidden text-right md:block">
                    <p class="text-sm font-bold text-slate-700">${user.name}</p>
                    <p class="text-xs text-slate-500">${user.role === 'admin' ? 'Директор' : 'Ученик ' + user.className}</p>
                  </div>
                  <button onclick="logoutUser()" class="rounded-2xl bg-gradient-to-r from-primary to-secondary px-5 py-3 text-sm font-bold text-white shadow-lg transition hover:scale-[1.02]">
                    Выйти
                  </button>
                </div>
              </div>
            </header>

            <main class="p-4 md:p-8 fade-in">
              ${content}
            </main>
          </div>
        </div>
      `;
    }

    function renderLogin() {
      return `
        <div class="flex min-h-screen items-center justify-center bg-hero-glow px-4">
          <div class="grid w-full max-w-6xl overflow-hidden rounded-[32px] bg-white shadow-deep lg:grid-cols-2">
            <div class="relative overflow-hidden bg-hero-glow p-10 text-white">
              <div class="relative z-10">
                <div class="inline-flex rounded-full bg-white/10 px-4 py-2 text-xs font-bold uppercase tracking-[0.25em] text-sky-200">
                  School Analytics Platform
                </div>
                <h1 class="mt-6 text-4xl font-black leading-tight">${SCHOOL_NAME}</h1>
                <p class="mt-5 max-w-xl text-slate-200">

                  планирование, мониторинг, анализ и принятие управленческих решений.

                <div class="mt-10 space-y-4">
                  <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                    <p class="text-sm font-bold">Директор</p>
                    <p class="mt-1 text-slate-200">${DIRECTOR_NAME}</p>
                    <p class="mt-2 text-sm text-sky-200">admin@school.kz</p>
                  </div>
                  <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                    <p class="text-sm font-bold">Ученик</p>
                    <p class="mt-1 text-slate-200">student@school.kz</p>
                  </div>
                  <div class="rounded-3xl border border-amber-300/20 bg-amber-400/10 p-5">
                    <p class="text-sm font-bold text-amber-200">Демо пароль</p>
                    <p class="mt-1 text-2xl font-black tracking-[0.3em] text-white">${DEMO_PASSWORD}</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-[linear-gradient(180deg,#ffffff_0%,#f6fbff_100%)] p-8 md:p-12">
              <div class="mb-8">
                <div class="inline-flex rounded-full bg-sky-100 px-4 py-2 text-xs font-bold uppercase tracking-[0.2em] text-sky-700">
                  Авторизация
                </div>
                <h2 class="mt-4 text-3xl font-black text-primary">Вход в систему</h2>
                <p class="mt-2 text-sm text-slate-500">Введите email и пароль для входа в кабинет</p>
              </div>

              <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                  <label class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
                  <input id="email" type="email" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-4 outline-none transition focus:border-sky-400 focus:ring-4 focus:ring-sky-100" placeholder="Введите email" />
                </div>

                <div>
                  <label class="mb-2 block text-sm font-semibold text-slate-700">Пароль</label>
                  <input id="password" type="password" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-4 outline-none transition focus:border-sky-400 focus:ring-4 focus:ring-sky-100" placeholder="Введите пароль" />
                </div>

                <div id="login-error" class="hidden rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600"></div>

                <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-primary via-secondary to-accent2 px-4 py-4 font-bold text-white shadow-lg transition hover:scale-[1.01]">
                  Войти в систему
                </button>
              </form>

              <div class="mt-6 rounded-3xl border border-sky-100 bg-sky-50 p-5 text-sm text-slate-600">
                <p class="font-bold text-primary">Демо-доступ:</p>
                <div class="mt-3 space-y-2">
                  <p><b>admin@school.kz</b> — директор</p>
                  <p><b>student@school.kz</b> — ученик</p>
                  <p><b>Пароль:</b> 0000</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAdminDashboard() {
      const totalStudents = students.length;
      const avgScore = (students.reduce((sum, s) => sum + s.average, 0) / students.length).toFixed(2);
      const avgAttendance = Math.round(students.reduce((sum, s) => sum + s.attendance, 0) / students.length);
      const planCompletion = Math.round(planningItems.reduce((sum, p) => sum + p.progress, 0) / planningItems.length);

      return getLayout(`
        <section class="mb-8 rounded-[30px] bg-gradient-to-r from-primary via-secondary to-accent2 p-8 text-white shadow-deep">
          <div class="grid gap-6 lg:grid-cols-2 lg:items-center">
            <div>
              <div class="inline-flex rounded-full bg-white/10 px-4 py-2 text-xs font-bold uppercase tracking-[0.22em] text-sky-200">
                Директорский кабинет
              </div>
              <h2 class="mt-4 text-4xl font-black leading-tight">${DIRECTOR_NAME}</h2>
              <p class="mt-3 text-slate-200">
                Комплексный обзор состояния школы: образовательные результаты, посещаемость,
                выполнение плана и аналитика по классам.
              </p>
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                <p class="text-sm text-slate-200">Школа</p>
                <p class="mt-2 text-lg font-bold">${SCHOOL_NAME}</p>
              </div>
              <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                <p class="text-sm text-slate-200">Роль</p>
                <p class="mt-2 text-lg font-bold">Директор</p>
              </div>
            </div>
          </div>
        </section>

        <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-4">
          ${statCard('Общее кол-во учеников', totalStudents, 'Все активные учащиеся школы', 'bg-gradient-to-br from-sky-400 to-cyan-500', 'Контингент')}
          ${statCard('Средний балл школы', avgScore, 'Интегральный показатель качества', 'bg-gradient-to-br from-emerald-400 to-green-500', 'Успеваемость')}
          ${statCard('Процент посещаемости', avgAttendance + '%', 'Средний показатель по школе', 'bg-gradient-to-br from-amber-400 to-orange-500', 'Посещаемость')}
          ${statCard('Выполнение плана', planCompletion + '%', 'Исполнение управленческих задач', 'bg-gradient-to-br from-violet-500 to-fuchsia-500', 'План')}
        </div>

        <div class="mt-8 grid gap-6 lg:grid-cols-3">

    function renderStudentRows() {
      const body = document.getElementById('students-body');
      if (!body) return;

      const search = (document.getElementById('student-search')?.value || '').toLowerCase();
      const selectedClass = document.getElementById('class-filter')?.value || 'Все';

      const filtered = students.filter(student => {
        const matchesSearch = student.name.toLowerCase().includes(search);
        const matchesClass = selectedClass === 'Все' || student.className === selectedClass;
        return matchesSearch && matchesClass;
      });

      body.innerHTML = filtered.map(student => `
        <tr class="border-b border-slate-100 transition hover:bg-sky-50/50">
          <td class="px-4 py-4 font-semibold text-slate-800">${student.name}</td>
          <td class="px-4 py-4">${student.className}</td>
          <td class="px-4 py-4">
            <span class="rounded-full bg-emerald-100 px-3 py-1 text-sm font-bold text-emerald-700">${student.average}</span>
          </td>
          <td class="px-4 py-4">
            <span class="rounded-full bg-sky-100 px-3 py-1 text-sm font-bold text-sky-700">
              ${student.attendance}%
            </span>
          </td>
        </tr>
      `).join('');
    }

    function updateMonitoringCharts() {
      const selected = document.getElementById('monitor-class-select')?.value || 'school';
      const data = getSelectedMonitoringData();
      const titleSuffix = selected === 'school' ? 'Вся школа' : 'Класс ' + selected;

      if (performanceChartInstance) performanceChartInstance.destroy();
      if (attendanceChartInstance) attendanceChartInstance.destroy();
      if (comparePerformanceChartInstance) comparePerformanceChartInstance.destroy();
      if (compareAttendanceChartInstance) compareAttendanceChartInstance.destroy();

      const perfCanvas = document.getElementById('performanceChart');
      const attCanvas = document.getElementById('attendanceChart');
      const comparePerfCanvas = document.getElementById('comparePerformanceChart');
      const compareAttCanvas = document.getElementById('compareAttendanceChart');

      if (perfCanvas) {
        performanceChartInstance = new Chart(perfCanvas, {
          type: 'line',
          data: {
            labels: data.map(i => i.month),
            datasets: [{
              label: 'Успеваемость — ' + titleSuffix,
              data: data.map(i => i.performance),
              borderColor: '#38BDF8',
              backgroundColor: 'rgba(56,189,248,0.18)',
              fill: true,
              tension: 0.35,
              borderWidth: 4,
              pointBackgroundColor: '#38BDF8',
              pointRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { font: { weight: 'bold' } } }
            }
          }
        });
      }

      if (attCanvas) {
        attendanceChartInstance = new Chart(attCanvas, {
          type: 'line',
          data: {
            labels: data.map(i => i.month),
            datasets: [{
              label: 'Посещаемость — ' + titleSuffix,
              data: data.map(i => i.attendance),
              borderColor: '#F59E0B',
              backgroundColor: 'rgba(245,158,11,0.20)',
              fill: true,
              tension: 0.35,
              borderWidth: 4,
              pointBackgroundColor: '#F59E0B',
              pointRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { font: { weight: 'bold' } } }
            }
          }
        });
      }

      if (comparePerfCanvas) {
        comparePerformanceChartInstance = new Chart(comparePerfCanvas, {
          type: 'bar',
          data: {
            labels: classComparison.map(i => i.className),
            datasets: [{
              label: 'Средний балл классов',
              data: classComparison.map(i => i.avgScore),
              backgroundColor: ['#7C3AED', '#38BDF8', '#22C55E', '#F59E0B'],
              borderRadius: 14
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
      }

      if (compareAttCanvas) {
        compareAttendanceChartInstance = new Chart(compareAttCanvas, {
          type: 'bar',
          data: {
            labels: classComparison.map(i => i.className),
            datasets: [{
              label: 'Посещаемость классов %',
              data: classComparison.map(i => i.attendance),
              backgroundColor: ['#0EA5E9', '#F59E0B', '#10B981', '#8B5CF6'],
              borderRadius: 14
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
      }
    }

          <b>Рекомендации по мониторингу:</b><br>
          • Разделить академические и дисциплинарные показатели<br>
          • Отслеживать данные отдельно по каждому классу<br>
          • Сравнивать классы между собой<br>
          • Выделять зоны риска цветовой индикацией<br>
          • Использовать графики для быстрых решений
        `;
      }

      if (msg.includes('анализ')) {
        return `
          <b>Рекомендации по анализу:</b><br>
          • Анализировать не только средний результат, но и динамику<br>
          • Искать причины отклонений по классам<br>
          • Сравнивать лидеров и отстающие классы<br>
          • Делать краткие управленческие выводы по итогам месяца<br>
          • Переводить выводы в конкретные действия
        `;
      }

      if (msg.includes('директор') || msg.includes('решени')) {
        return `
          <b>Рекомендации директору:</b><br>
          • Использовать данные как основу управленческих решений<br>
          • Усилить контроль классов риска<br>
          • Поддерживать эффективных педагогов и классных руководителей<br>
          • Вести цикл: планирование → мониторинг → анализ → коррекция<br>
          • Регулярно представлять результаты на педсовете
        `;
      }

      return `
        <b>AI-рекомендация:</b><br>
        Попробуйте задать вопрос точнее. Например:<br>
        • как улучшить посещаемость?<br>
        • как повысить успеваемость?<br>
        • что делать со слабыми классами?<br>
        • рекомендации по мониторингу<br>
        • рекомендации по анализу
      `;
    }

    function sendAIMessage() {
      const input = document.getElementById('aiInput');
      if (!input) return;

      const text = input.value.trim();
      if (!text) return;

      addAIMessage(text, 'user');
      input.value = '';

      setTimeout(() => {
        const reply = getAIRecommendation(text);
        addAIMessage(reply, 'bot');
      }, 500);
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('login-error');

      const user = loginUser(email, password);

      if (!user) {
        errorBox.classList.remove('hidden');
        errorBox.textContent = 'Неверный email или пароль. Используйте admin@school.kz / student@school.kz и пароль 0000';
        return;
      }

      currentPage = user.role === 'admin' ? 'admin-dashboard' : 'student-dashboard';
      renderApp();
    }

    function renderApp() {
      const app = document.getElementById('app');
      const user = getStoredUser();

      if (!user) {
        app.innerHTML = renderLogin();
        return;
      }

      if (user.role === 'admin') {
        if (!currentPage.startsWith('admin')) currentPage = 'admin-dashboard';
      } else {
        if (!currentPage.startsWith('student')) currentPage = 'student-dashboard';
      }

      if (currentPage === 'admin-dashboard') app.innerHTML = renderAdminDashboard();
      if (currentPage === 'admin-students') app.innerHTML = renderStudentManagement();
      if (currentPage === 'admin-planning') app.innerHTML = renderPlanning();
      if (currentPage === 'admin-monitoring') app.innerHTML = renderMonitoring();
      if (currentPage === 'admin-analysis') app.innerHTML = renderAnalysis();
      if (currentPage === 'student-dashboard') app.innerHTML = renderStudentDashboard();

      renderStudentRows();
      renderChartsIfNeeded();
    }

    renderApp();
  </script>
