      if (user) setStoredUser(user);
      return user;
    }

    function navigateTo(page) {
      const user = getStoredUser();

      if (!user) {
        currentPage = 'login';
        renderApp();
        return;
      }

      if (user.role === 'user' && page.startsWith('admin')) {
        currentPage = 'student-dashboard';
        renderApp();
        return;
      }

      if (user.role === 'admin' && page.startsWith('student')) {
        currentPage = 'admin-dashboard';
        renderApp();
        return;
      }

      currentPage = page;
      renderApp();
    }

        return currentLang === 'ru'
          ? `<b>Рекомендации по мониторингу:</b><br>• Разделить академические и дисциплинарные показатели<br>• Отслеживать данные отдельно по каждому классу<br>• Сравнивать классы между собой<br>• Выделять зоны риска цветовой индикацией<br>• Использовать графики для быстрых решений`
          : `<b>Мониторинг бойынша ұсыныстар:</b><br>• Академиялық және тәртіптік көрсеткіштерді бөлу<br>• Әр сынып бойынша деректерді жеке қадағалау<br>• Сыныптарды өзара салыстыру<br>• Тәуекел аймақтарын түспен белгілеу<br>• Жылдам шешімдер үшін графиктерді қолдану`;
      }

      if (msg.includes('анализ') || msg.includes('талдау')) {
        return currentLang === 'ru'
          ? `<b>Рекомендации по анализу:</b><br>• Анализировать не только средний результат, но и динамику<br>• Искать причины отклонений по классам<br>• Сравнивать лидеров и отстающие классы<br>• Делать краткие управленческие выводы по итогам месяца<br>• Переводить выводы в конкретные действия`
          : `<b>Талдау бойынша ұсыныстар:</b><br>• Тек орташа нәтижені емес, динамиканы да талдау<br>• Сыныптар бойынша ауытқулардың себептерін іздеу<br>• Көшбасшы және артта қалған сыныптарды салыстыру<br>• Ай қорытындысы бойынша қысқа басқарушылық тұжырым жасау<br>• Қорытындыны нақты әрекетке айналдыру`;
      }

      return currentLang === 'ru'
        ? `<b>AI-рекомендация:</b><br>Попробуйте задать вопрос точнее. Например:<br>• как улучшить посещаемость?<br>• как повысить успеваемость?<br>• что делать со слабыми классами?<br>• рекомендации по мониторингу<br>• рекомендации по анализу`
        : `<b>AI-ұсыныс:</b><br>Сұрағыңызды нақтырақ қойып көріңіз. Мысалы:<br>• қатысуды қалай жақсартуға болады?<br>• үлгерімді қалай арттыруға болады?<br>• әлсіз сыныптармен не істеу керек?<br>• мониторинг бойынша ұсыныстар<br>• талдау бойынша ұсыныстар`;
    }

    function sendAIMessage() {
      const input = document.getElementById('aiInput');
      if (!input) return;

      const text = input.value.trim();
      if (!text) return;

      addAIMessage(text, 'user');
      input.value = '';

      setTimeout(() => {
        const reply = getAIRecommendation(text);
        addAIMessage(reply, 'bot');
      }, 500);
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('login-error');

      const user = loginUser(email, password);

      if (!user) {
        errorBox.classList.remove('hidden');
        errorBox.textContent = t('invalid_login');
        return;
      }

      currentPage = user.role === 'admin' ? 'admin-dashboard' : 'student-dashboard';
      renderApp();
    }

    function renderApp() {
      const app = document.getElementById('app');
      const user = getStoredUser();

      if (!user) {
        app.innerHTML = renderLogin();
        updateStaticLanguageParts();
        return;
      }

      if (user.role === 'admin') {
        if (!currentPage.startsWith('admin')) currentPage = 'admin-dashboard';
      } else {
        if (!currentPage.startsWith('student')) currentPage = 'student-dashboard';
      }

      if (currentPage === 'admin-dashboard') app.innerHTML = renderAdminDashboard();
      if (currentPage === 'admin-students') app.innerHTML = renderStudentManagement();
      if (currentPage === 'admin-planning') app.innerHTML = renderPlanning();
      if (currentPage === 'admin-monitoring') app.innerHTML = renderMonitoring();
      if (currentPage === 'admin-analysis') app.innerHTML = renderAnalysis();
      if (currentPage === 'student-dashboard') app.innerHTML = renderStudentDashboard();

      renderStudentRows();
      renderChartsIfNeeded();
    }

    renderApp();
    updateStaticLanguageParts();
  </script>
</body>
</html>
